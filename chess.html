<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illias — A Game of Chess</title>
<meta name="description" content="Illias — play the wizard at chess.">
<link rel="stylesheet" href="cursors.css">
<style>
@font-face {
  font-family: "Olde English";
  src: url("tribute/olde-english.woff") format("woff");
  font-weight: 400; font-style: normal; font-display: block;
}
/* ------------------------------------------------------------------
   ILLIAS — the wizard's chessboard
   A vellum board on the forest floor. You hold the pale pieces.
------------------------------------------------------------------- */
:root {
  --bark: #0b0f0c; --vellum: #e9dec3; --vellum-deep: #cdb98a; --vellum-lit: #fbf3dc;
  --ink: #2b1d12; --ink-soft: #5a4531; --minium: #cf3422; --minium-lit: #f0482f; --moss: #5d6a2a;
  --scribe: "Olde English", "Old English Text MT", "Luminari", "Apple Chancery", fantasy, serif;
  --sq: min(9.3vh, 11.4vw);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  font-family: var(--scribe); color: var(--vellum); -webkit-font-smoothing: antialiased;
  background: radial-gradient(ellipse 80% 70% at 50% 40%, #1c2030, var(--bark) 75%);
  display: grid; place-items: center; padding: 2vh 2vw;
}
.home {
  position: fixed; left: 20px; top: 14px; z-index: 3; color: var(--vellum); text-decoration: none;
  font-size: clamp(20px, 3.2vh, 30px); line-height: 1; opacity: .82; text-shadow: 0 .05em 0 #1d1004, 0 .1em .35em rgba(0, 0, 0, .8);
}
.home b { font-weight: 400; color: var(--minium-lit); }
.home:hover, .home:focus-visible { opacity: 1; outline: none; }

.table { display: grid; justify-items: center; gap: 1.6vh; }
.says {
  margin: 0; min-height: 2.3em; max-width: calc(var(--sq) * 8.4); text-align: center;
  font-size: clamp(20px, 3.7vh, 34px); line-height: 1.12; font-weight: 400;
  text-shadow: 0 .05em 0 #1d1004, 0 .1em .4em rgba(0, 0, 0, .8);
}
.says b { font-weight: 400; color: var(--minium-lit); }

.board {
  display: grid; grid-template: repeat(8, var(--sq)) / repeat(8, var(--sq));
  padding: calc(var(--sq) * .16); background: #3a2a18;
  box-shadow: 0 0 0 2px #1d1004, 0 0 0 calc(var(--sq) * .05) var(--vellum-deep), 0 2.4vh 6vh rgba(0, 0, 0, .7);
}
.s {
  position: relative; border: 0; padding: 0; margin: 0; display: grid; place-items: center;
  font: 400 calc(var(--sq) * .78)/1 "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols2", "DejaVu Sans", serif;
  background: var(--vellum); color: var(--ink); outline: none;
}
.s.d { background: #a98f5a; }
.s.w { color: var(--vellum-lit); text-shadow: 0 0 1px #1d1004, 0 0 1px #1d1004, 0 0 2px #1d1004, 0 .04em 0 #1d1004, 0 .08em .12em rgba(0, 0, 0, .5); }
.s.b { color: #1c120a; text-shadow: 0 0 1px rgba(251, 243, 220, .7), 0 .06em .1em rgba(0, 0, 0, .35); }
.s.last::before { content: ""; position: absolute; inset: 0; background: rgba(207, 162, 74, .42); }
.s.sel::before  { content: ""; position: absolute; inset: 0; background: rgba(207, 52, 34, .38); }
.s.chk::before  { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(240, 72, 47, .85), rgba(240, 72, 47, 0) 72%); }
.s.to::after {
  content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%;
  background: rgba(43, 29, 18, .42); box-shadow: 0 0 0 2px rgba(251, 243, 220, .35);
}
.s.to.cap::after { width: 86%; height: 86%; background: none; box-shadow: inset 0 0 0 calc(var(--sq) * .07) rgba(207, 52, 34, .7); }
.s span { position: relative; z-index: 1; }
.s:focus-visible { box-shadow: inset 0 0 0 3px var(--minium); z-index: 2; }
.s.moved span { animation: land .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes land { from { transform: scale(1.35) translateY(-12%); opacity: .5; } to { transform: none; opacity: 1; } }

.bar { display: flex; gap: 1.4em; align-items: center; font-size: clamp(18px, 3vh, 26px); }
.btn {
  background: none; border: 0; padding: .1em .2em; font: inherit; color: var(--vellum); opacity: .85;
  text-shadow: 0 .05em 0 #1d1004, 0 .1em .35em rgba(0, 0, 0, .8);
}
.btn b { font-weight: 400; color: var(--minium-lit); }
.btn:hover, .btn:focus-visible { opacity: 1; outline: none; text-decoration: underline; text-decoration-thickness: .05em; text-underline-offset: .14em; }
.count { color: var(--vellum-deep); opacity: .8; font-family: "Apple Symbols", "Segoe UI Symbol", serif; font-size: .9em; letter-spacing: .05em; min-height: 1.2em; }

@media (max-aspect-ratio: 1/1) { body { padding-top: 60px; } }
@media (prefers-reduced-motion: reduce) { .s.moved span { animation: none; } }
</style>
</head>
<body>
<a class="home" href="index.html"><b>R</b>eturn to the wood</a>

<main class="table">
  <p class="says" id="says" aria-live="polite"></p>
  <div class="board" id="board" role="grid" aria-label="Chessboard. You play the pale pieces."></div>
  <div class="bar">
    <button class="btn" id="again" type="button"><b>N</b>ew game</button>
    <span class="count" id="count" aria-label="Captured pieces"></span>
  </div>
</main>

<script src="chess-engine.js"></script>
<script>
(() => {
  const E = window.WizardChess;
  const boardEl = document.getElementById('board'), says = document.getElementById('says'), count = document.getElementById('count');
  const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
  const NAME  = { k: 'king', q: 'queen', r: 'rook', b: 'bishop', n: 'knight', p: 'pawn' };
  const sqName = i => 'abcdefgh'[i & 7] + (8 - (i >> 3));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rubric = s => `<b>${s[0]}</b>${s.slice(1)}`;
  const say = s => { says.innerHTML = rubric(s); };

  const LINES = {
    open:    ['Pale moves first. It is the last courtesy thou shalt have of me.', 'Sit, then. The board hath waited longer than thou hast lived.', 'Begin. I have all the time the forest has.'],
    quiet:   ['Hm.', 'Bold. Foolish, but bold.', 'I have seen that move before. It ended in tears.', 'The trees are watching thee blunder.', 'Go on, go on.', 'So that is thy plan. Curious.', 'A move, certainly. I shall say no more.'],
    took:    ['I shall keep that.', 'Mine. It will make a fine paperweight.', 'One fewer to trouble thee.', 'Thou wert not using it well.'],
    lost:    ['A trifle. Take it.', 'Thou hast teeth after all.', 'I never liked that one.', 'Enjoy it. It is the last.'],
    check:   ['Check. Mind thy king.', 'Check. He looks nervous.', 'Check, little wanderer.'],
    checked: ['Check, is it? How dare thee.', 'My king hath survived worse than thee.'],
    won:     ['Checkmate. The forest keeps another king.', 'Checkmate. Return when thou hast grown wiser.'],
    beaten:  ['Checkmate…? Impossible. Tell no one of this.', 'Thou hast beaten me. The owls will never let me hear the end of it.'],
    draw:    ['Stalemate. Neither of us leaves the wood today.']
  };

  let s, sel = -1, moves = [], last = null, over = false, thinking = false, taken = [];
  const squares = [];
  for (let i = 0; i < 64; i++) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 's' + (((i >> 3) + (i & 7)) % 2 ? ' d' : '');
    b.innerHTML = '<span></span>';
    b.addEventListener('click', () => click(i));
    boardEl.appendChild(b); squares.push(b);
  }

  function draw(movedTo = -1) {
    const chk = E.inCheck(s) ? s.b.indexOf(s.w ? 'K' : 'k') : -1;
    const targets = new Map(moves.filter(m => m.f === sel).map(m => [m.t, m]));
    squares.forEach((el, i) => {
      const p = s.b[i], white = p !== '.' && E.isW(p);
      el.firstChild.textContent = p === '.' ? '' : GLYPH[p.toLowerCase()] + '︎';
      el.classList.toggle('w', p !== '.' && white); el.classList.toggle('b', p !== '.' && !white);
      el.classList.toggle('sel', i === sel); el.classList.toggle('chk', i === chk);
      el.classList.toggle('last', !!last && (i === last.f || i === last.t));
      el.classList.toggle('to', targets.has(i)); el.classList.toggle('cap', targets.has(i) && (p !== '.' || !!targets.get(i).ep));
      el.classList.toggle('moved', i === movedTo);
      el.setAttribute('aria-label', sqName(i) + (p === '.' ? '' : ', ' + (white ? 'pale ' : 'dark ') + NAME[p.toLowerCase()]));
    });
    count.textContent = taken.map(p => GLYPH[p.toLowerCase()] + '︎').join('');
  }

  function play(m) {
    const cap = m.ep ? (s.w ? 'p' : 'P') : s.b[m.t];
    if (cap !== '.') taken.push(cap);
    s = E.make(s, m); last = m; sel = -1; moves = E.legal(s);
    draw(m.t);
    return cap !== '.';
  }
  function ended() {
    if (moves.length) return false;
    over = true;
    say(pick(!E.inCheck(s) ? LINES.draw : s.w ? LINES.won : LINES.beaten));
    return true;
  }

  function click(i) {
    if (over || thinking || !s.w) return;
    const m = moves.find(m => m.f === sel && m.t === i && (!m.promo || m.promo === 'Q'));
    if (m) {
      const took = play(m);
      if (ended()) return;
      thinking = true;
      const youCheck = E.inCheck(s);
      setTimeout(() => {
        const r = E.best(s, 3), wizTook = play(r);
        thinking = false;
        if (ended()) return;
        say(pick(E.inCheck(s) ? LINES.check : wizTook ? LINES.took : youCheck ? LINES.checked : took ? LINES.lost : LINES.quiet));
      }, 450);
      return;
    }
    const p = s.b[i];
    sel = (p !== '.' && E.isW(p) && i !== sel) ? i : -1;
    draw();
  }

  function fresh() { s = E.fresh(); sel = -1; last = null; over = false; thinking = false; taken = []; moves = E.legal(s); draw(); say(pick(LINES.open)); }
  document.getElementById('again').addEventListener('click', fresh);
  fresh();
})();
</script>
</body>
</html>
